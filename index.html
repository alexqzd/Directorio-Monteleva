<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio Monteleva — Torre B</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --warm: #E8E0D5;
    --terracotta: #C4714A;
    --terracotta-dark: #A05B37;
    --charcoal: #2A2420;
    --mid: #6B5A50;
    --gold: #D4A853;
    --sage: #7A8C6E;
    --sky: #5C87A3;
    --rose: #C4647A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--charcoal);
    padding: 2.5rem 3rem 2rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 3px solid var(--terracotta);
    opacity: .18;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40%;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: var(--terracotta);
    opacity: .07;
  }
  .header-inner { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
  .header-tag {
    display: inline-block;
    background: var(--terracotta);
    color: #fff;
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: .3rem .8rem;
    border-radius: 2px;
    margin-bottom: .8rem;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    color: var(--cream);
    line-height: 1.05;
    letter-spacing: -.02em;
  }
  header h1 em {
    font-style: normal;
    color: var(--gold);
  }
  header p {
    color: #9A8A80;
    font-size: .9rem;
    margin-top: .6rem;
    font-weight: 300;
  }

  /* ── SEARCH + FILTERS ── */
  .controls {
    background: var(--warm);
    border-bottom: 1px solid #D9D0C5;
    padding: 1.2rem 3rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(42,36,32,.06);
  }
  .controls-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--cream);
    border: 1.5px solid #C5B9AF;
    border-radius: 6px;
    padding: .6rem 1rem .6rem 2.6rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    color: var(--charcoal);
    outline: none;
    transition: border .2s;
  }
  .search-wrap input:focus { border-color: var(--terracotta); }
  .search-wrap svg {
    position: absolute;
    left: .8rem; top: 50%;
    transform: translateY(-50%);
    color: var(--mid);
  }
  .filters {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--cream);
    border: 1.5px solid #C5B9AF;
    color: var(--mid);
    font-family: 'DM Sans', sans-serif;
    font-size: .78rem;
    font-weight: 500;
    padding: .35rem .85rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all .18s;
  }
  .pill:hover, .pill.active {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    max-width: 1200px;
    margin: 1.6rem auto .4rem;
    padding: 0 3rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .stats-bar span {
    font-size: .8rem;
    color: var(--mid);
  }
  .stats-bar strong { color: var(--terracotta); }
  .divider-dot { color: #C5B9AF; }

  /* ── GRID ── */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 3rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.4rem;
  }

  /* ── CARD ── */
  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #EAE3DB;
    padding: 1.4rem;
    position: relative;
    transition: transform .18s, box-shadow .18s;
    animation: fadeUp .35s ease both;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(42,36,32,.1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: .5rem;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
    color: #fff;
  }
  .badge-resident {
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .2rem .55rem;
    border-radius: 12px;
    background: #EEF5F0;
    color: var(--sage);
    border: 1px solid #C8DCC5;
  }
  .badge-outside {
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .2rem .55rem;
    border-radius: 12px;
    background: #F3F0FB;
    color: var(--sky);
    border: 1px solid #C5D4E0;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.25;
  }
  .card-service {
    font-size: .82rem;
    color: var(--mid);
    font-weight: 300;
    line-height: 1.45;
    flex: 1;
  }

  .card-footer {
    border-top: 1px solid #EAE3DB;
    padding-top: .75rem;
    margin-top: .3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .phone-link {
    display: flex;
    align-items: center;
    gap: .35rem;
    color: var(--terracotta);
    text-decoration: none;
    font-size: .82rem;
    font-weight: 500;
    transition: color .15s;
  }
  .phone-link:hover { color: var(--terracotta-dark); }

  .discount-tag {
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: #FFF6E5;
    border: 1px solid #F0D89A;
    color: var(--gold);
    padding: .15rem .5rem;
    border-radius: 10px;
  }

  /* category color dots */
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: .35rem;
  }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--mid);
  }
  .empty span { font-size: 2.5rem; display: block; margin-bottom: .8rem; }
  .empty p { font-size: .9rem; }

  /* ── FOOTER ── */
  footer {
    background: var(--charcoal);
    text-align: center;
    padding: 1.5rem;
    color: #6B5A50;
    font-size: .78rem;
  }
  footer strong { color: var(--terracotta); }

  @media (max-width: 600px) {
    header, .controls, .grid, .stats-bar { padding-left: 1.2rem; padding-right: 1.2rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function colorForName(name) {
  let h = 0;
  for(let c of name) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}
function formatPhone(p) {
  return p.replace(/\D/g,'').replace(/^52/,'');
}

let activeFilter = 'todos';
let searchTerm = '';

function render() {
  const grid = document.getElementById('grid');
  const filtered = entries.filter(e => {
    const matchCat = activeFilter === 'todos' || e.cat === activeFilter;
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || e.name.toLowerCase().includes(q) || e.service.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  filtered.sort((a,b) => a.name.localeCompare(b.name, 'es'));
  document.getElementById('count').textContent = filtered.length;

  if(!filtered.length) {
    grid.innerHTML = `<div class="empty"><span>🔍</span><p>No encontramos vecinos con ese criterio.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((e,i) => {
    const color = colorForName(e.name);
    const init = initials(e.name);
    const phone = formatPhone(e.phone);
    const badge = e.resident
      ? `<span class="badge-resident">Residente</span>`
      : `<span class="badge-outside">Externo</span>`;

    return `
    <div class="card" style="animation-delay:${i*0.03}s">
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:.65rem;">
          <div class="avatar" style="background:${color}">${init}</div>
          <div>
            <div class="card-name">${e.name}</div>
          </div>
        </div>
        ${badge}
      </div>
      <div class="card-service">${e.service}</div>
      <div class="card-footer">
        <a class="phone-link" href="tel:${phone}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.59 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.73a16 16 0 0 0 6 6l.93-.93a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.5 16.92z"/></svg>
          ${phone}
        </a>
        ${e.discount ? '<span class="discount-tag">🏷 Descuento vecino</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

document.getElementById('filters').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if(!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeFilter = pill.dataset.cat;
  render();
});

render();
</script>
</body>
</html>
