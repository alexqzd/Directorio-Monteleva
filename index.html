<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Directorio Monteleva Central</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F7F3ED;
    --warm: #E8E0D5;
    --terracotta: #C4714A;
    --terracotta-dark: #A05B37;
    --charcoal: #2A2420;
    --mid: #6B5A50;
    --gold: #D4A853;
    --sage: #7A8C6E;
    --sky: #5C87A3;
    --rose: #C4647A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--charcoal);
    padding: 2.5rem 3rem 2rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 3px solid var(--terracotta);
    opacity: .18;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 40%;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: var(--terracotta);
    opacity: .07;
  }
  .header-inner { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
  .header-tag {
    display: inline-block;
    background: var(--terracotta);
    color: #fff;
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    padding: .3rem .8rem;
    border-radius: 2px;
    margin-bottom: .8rem;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 5vw, 4rem);
    font-weight: 900;
    color: var(--cream);
    line-height: 1.05;
    letter-spacing: -.02em;
  }
  header h1 em {
    font-style: normal;
    color: var(--gold);
  }
  header p {
    color: #9A8A80;
    font-size: .9rem;
    margin-top: .6rem;
    font-weight: 300;
  }

  /* ── SEARCH + FILTERS ── */
  .controls {
    background: var(--warm);
    border-bottom: 1px solid #D9D0C5;
    padding: 1.2rem 3rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(42,36,32,.06);
  }
  .controls-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    gap: 1rem;
    align-items: center;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    background: var(--cream);
    border: 1.5px solid #C5B9AF;
    border-radius: 6px;
    padding: .6rem 1rem .6rem 2.6rem;
    font-family: 'DM Sans', sans-serif;
    font-size: .9rem;
    color: var(--charcoal);
    outline: none;
    transition: border .2s;
  }
  .search-wrap input:focus { border-color: var(--terracotta); }
  .search-wrap svg {
    position: absolute;
    left: .8rem; top: 50%;
    transform: translateY(-50%);
    color: var(--mid);
  }
  .filters {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .pill {
    background: var(--cream);
    border: 1.5px solid #C5B9AF;
    color: var(--mid);
    font-family: 'DM Sans', sans-serif;
    font-size: .78rem;
    font-weight: 500;
    padding: .35rem .85rem;
    border-radius: 20px;
    cursor: pointer;
    transition: all .18s;
  }
  .pill:hover, .pill.active {
    background: var(--terracotta);
    border-color: var(--terracotta);
    color: #fff;
  }

  /* ── STATS BAR ── */
  .stats-bar {
    max-width: 1200px;
    margin: 1.6rem auto .4rem;
    padding: 0 3rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .stats-bar span {
    font-size: .8rem;
    color: var(--mid);
  }
  .stats-bar strong { color: var(--terracotta); }
  .divider-dot { color: #C5B9AF; }

  /* ── GRID ── */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 1rem 3rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.4rem;
  }

  /* ── CARD ── */
  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #EAE3DB;
    padding: 1.4rem;
    position: relative;
    transition: transform .18s, box-shadow .18s;
    animation: fadeUp .35s ease both;
    display: flex;
    flex-direction: column;
    gap: .5rem;
  }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(42,36,32,.1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: .5rem;
  }
  .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-size: 1.1rem;
    flex-shrink: 0;
    color: #fff;
  }
  .badge-resident {
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .2rem .55rem;
    border-radius: 12px;
    background: #EEF5F0;
    color: var(--sage);
    border: 1px solid #C8DCC5;
  }
  .badge-outside {
    font-size: .62rem;
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: .2rem .55rem;
    border-radius: 12px;
    background: #F3F0FB;
    color: var(--sky);
    border: 1px solid #C5D4E0;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--charcoal);
    line-height: 1.25;
  }
  .card-service {
    font-size: .82rem;
    color: var(--mid);
    font-weight: 300;
    line-height: 1.45;
    flex: 1;
  }

  .card-footer {
    border-top: 1px solid #EAE3DB;
    padding-top: .75rem;
    margin-top: .3rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .phone-link {
    display: flex;
    align-items: center;
    gap: .35rem;
    color: var(--terracotta);
    text-decoration: none;
    font-size: .82rem;
    font-weight: 500;
    transition: color .15s;
  }
  .phone-link:hover { color: var(--terracotta-dark); }

  .discount-tag {
    font-size: .65rem;
    font-weight: 500;
    letter-spacing: .06em;
    text-transform: uppercase;
    background: #FFF6E5;
    border: 1px solid #F0D89A;
    color: var(--gold);
    padding: .15rem .5rem;
    border-radius: 10px;
  }

  /* category color dots */
  .cat-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: .35rem;
  }

  /* ── EMPTY STATE ── */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem 1rem;
    color: var(--mid);
  }
  .empty span { font-size: 2.5rem; display: block; margin-bottom: .8rem; }
  .empty p { font-size: .9rem; }

  /* ── FOOTER ── */
  footer {
    background: var(--charcoal);
    text-align: center;
    padding: 1.5rem;
    color: #6B5A50;
    font-size: .78rem;
  }
  footer strong { color: var(--terracotta); }

  /* ── VER MÁS button ── */
  .more-btn {
    background: none;
    border: none;
    color: var(--terracotta);
    font-size: .75rem;
    cursor: pointer;
    padding: 0;
    font-family: inherit;
  }
  .more-btn:hover { text-decoration: underline; }

  /* ── SOCIAL LINE ── */
  .card-social {
    display: flex;
    align-items: center;
    gap: .3rem;
    font-size: .72rem;
    color: var(--mid);
    margin-top: .15rem;
    line-height: 1.2;
  }
  .card-social svg { flex-shrink: 0; opacity: .6; }
  .social-link {
    color: var(--sky);
    text-decoration: none;
  }
  .social-link:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    header, .controls, .grid, .stats-bar { padding-left: 1.2rem; padding-right: 1.2rem; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-tag">Monterrey · Comunidad</div>
    <h1>Directorio<br><em>Monteleva</em></h1>
    <p>Servicios y profesionales de nuestra comunidad · Edición Febrero 2026</p>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar servicio o nombre…">
    </div>
    <div class="filters" id="filters">
      <button class="pill active" data-cat="todos">Todos</button>
      <button class="pill" data-cat="salud">🩺 Salud</button>
      <button class="pill" data-cat="legal">⚖️ Legal</button>
      <button class="pill" data-cat="construccion">🏗️ Construcción</button>
      <button class="pill" data-cat="tech">💻 Tech</button>
      <button class="pill" data-cat="food">🥘 Comida</button>
      <button class="pill" data-cat="belleza">💅 Belleza</button>
      <button class="pill" data-cat="educacion">📚 Educación</button>
      <button class="pill" data-cat="finanzas">💰 Finanzas</button>
      <button class="pill" data-cat="otros">Otros</button>
    </div>
  </div>
</div>

<div class="stats-bar">
  <span>Mostrando <strong id="count">0</strong> vecinos</span>
  <span class="divider-dot">·</span>
  <span>🏠 Residentes tienen <strong>descuentos preferentes</strong></span>
</div>

<div class="grid" id="grid"></div>

<footer>Directorio Monteleva Central — Datos actualizados a Febrero 2026</footer>

<script>
const COLORS = ['#C4714A','#7A8C6E','#5C87A3','#C4647A','#D4A853','#8B6FAE','#4A8C8C','#A05B37'];

// ── SOCIAL FIELD: render from pre-processed entry fields ──
function socialHtml(e) {
  const display = e.socialDisplay || '';
  const url     = e.socialUrl     || '';
  if (!display) return '';
  const icon = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
  const inner = url
    ? `<a class="social-link" href="${escHtml(url)}" target="_blank" rel="noopener">${escHtml(display)}</a>`
    : `<span>${escHtml(display)}</span>`;
  return `<div class="card-social">${icon}${inner}</div>`;
}

// ── UTILITIES ──
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function initials(name) {
  return name.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function colorForName(name) {
  let h = 0;
  for (const c of name) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return COLORS[Math.abs(h) % COLORS.length];
}
function formatPhone(p) {
  const nums = Array.isArray(p) ? p : [p];
  return nums.map(n => n.replace(/[\s\u200b]/g,'').replace(/[^0-9+]/g,'').replace(/^\+?52/,'')).filter(Boolean);
}

// ── "VER MÁS" toggle ──
const LIMIT = 150;

function serviceHtml(text, idx) {
  const clean = text.replace(/\n+/g, ' ').trim();
  const safe  = escHtml(clean);
  if (clean.length <= LIMIT) return `<div class="card-service">${safe}</div>`;
  const short = escHtml(clean.slice(0, LIMIT));
  return `<div class="card-service">` +
    `<span id="ss${idx}">${short}… <button class="more-btn" onclick="toggleSvc(${idx})">Ver más</button></span>` +
    `<span id="sf${idx}" style="display:none">${safe} <button class="more-btn" onclick="toggleSvc(${idx})">Ver menos</button></span>` +
    `</div>`;
}

function toggleSvc(idx) {
  const s = document.getElementById('ss' + idx);
  const f = document.getElementById('sf' + idx);
  const showFull = s.style.display !== 'none';
  s.style.display = showFull ? 'none' : '';
  f.style.display = showFull ? ''     : 'none';
}

// ── STATE ──
let activeFilter = 'todos';
let searchTerm = '';
let currentEntries = [];

// ── RENDER ──
function render() {
  const grid = document.getElementById('grid');
  const filtered = currentEntries.filter(e => {
    if (e.hidden) return false;
    const matchCat = activeFilter === 'todos' || e.cat === activeFilter;
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || e.name.toLowerCase().includes(q) || e.service.toLowerCase().includes(q);
    return matchCat && matchSearch;
  });

  filtered.sort((a,b) => a.name.localeCompare(b.name, 'es'));
  document.getElementById('count').textContent = filtered.length;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><span>🔍</span><p>No encontramos vecinos con ese criterio.</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map((e, i) => {
    const color = colorForName(e.name);
    const init  = initials(e.name);
    const phones = formatPhone(e.phone);
    const badge = e.resident
      ? `<span class="badge-resident">Residente</span>`
      : `<span class="badge-outside">Externo</span>`;
    const phoneHtml = phones.length
      ? phones.map(phone => `<a class="phone-link" href="tel:+52${phone}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.62 3.38 2 2 0 0 1 3.59 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.73a16 16 0 0 0 6 6l.93-.93a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.5 16.92z"/></svg>
          ${phone}
        </a>`).join('')
      : '';

    return `
    <div class="card" style="animation-delay:${i*0.03}s">
      <div class="card-top">
        <div style="display:flex;align-items:center;gap:.65rem;">
          <div class="avatar" style="background:${color}">${init}</div>
          <div>
            <div class="card-name">${escHtml(e.name)}</div>
            ${socialHtml(e)}
          </div>
        </div>
        ${badge}
      </div>
      ${serviceHtml(e.service, i)}
      <div class="card-footer">
        ${phoneHtml}
        ${e.discount ? '<span class="discount-tag">🏷 Descuento vecino</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

// ── LOAD DIRECTORY ──
fetch('directory.json')
  .then(r => {
    if (!r.ok) throw new Error('No se pudo cargar el directorio');
    return r.json();
  })
  .then(data => {
    currentEntries = Array.isArray(data) ? data.filter(e => !e.hidden) : [];
    render();
  })
  .catch(err => {
    document.getElementById('grid').innerHTML =
      `<div class="empty"><span>⚠️</span><p>${escHtml(err.message)}</p></div>`;
  });

// ── EVENTS ──
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

document.getElementById('filters').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeFilter = pill.dataset.cat;
  render();
});
</script>
</body>
</html>
